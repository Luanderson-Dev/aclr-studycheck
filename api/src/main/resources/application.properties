spring.application.name=studycheck

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studycheck_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Jackson 3 (Boot 4) serializa java.time como ISO-8601 por padrão — sem config extra.

# JWT
app.security.jwt.segredo=${JWT_SEGREDO:UmaChaveSecretaMuitoLongaComNoMinimo256BitsParaHMACSHA256!@#2026StudyCheckAbCdEf}
app.security.jwt.expiracao-access-token=900000
app.security.jwt.expiracao-refresh-token=604800000

# Cookie (false para dev local sem HTTPS, true em produção com HTTPS)
app.security.cookie.seguro=${APP_SECURITY_COOKIE_SEGURO:false}

# Bot API Key (used by Discord bot for internal endpoints)
app.bot.api-key=${BOT_API_KEY:change-me-in-production}

# Discord OAuth
app.discord.client-id=${DISCORD_CLIENT_ID:}
app.discord.client-secret=${DISCORD_CLIENT_SECRET:}
app.discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:4200/auth/discord/callback}
app.discord.guild-id=${DISCORD_GUILD_ID:}
app.discord.mod-role-id=${DISCORD_MOD_ROLE_ID:}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${spring.application.name}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.retries=10

# Consumer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:studycheck-api}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.aceleradev.studycheck.*

# Listener
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.concurrency=3
