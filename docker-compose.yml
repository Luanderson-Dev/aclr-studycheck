services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studycheck_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - study_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: studycheck
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - study_network

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-studycheck_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SEGREDO: ${JWT_SEGREDO}
      BOT_API_KEY: ${BOT_API_KEY}
      APP_SECURITY_COOKIE_SEGURO: ${APP_SECURITY_COOKIE_SEGURO:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:4200/auth/discord/callback}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_MOD_ROLE_ID: ${DISCORD_MOD_ROLE_ID:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-studycheck-api}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - study_network
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bot:
    build: ./bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_LOG_CHANNEL_ID: ${DISCORD_LOG_CHANNEL_ID:-}
      DISCORD_ALLOWED_VOICE_CHANNEL_IDS: ${DISCORD_ALLOWED_VOICE_CHANNEL_IDS:-}
      BOT_API_KEY: ${BOT_API_KEY}
      STUDYCHECK_API_URL: http://api:8080
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      OWNER_DISCORD_ID: ${OWNER_DISCORD_ID:-}
      SECRET_SYNC_TOKEN: ${SECRET_SYNC_TOKEN:-}
    networks:
      - study_network
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:8080
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,localhost:4200,127.0.0.1}
    ports:
      - "${FRONTEND_PORT:-4200}:4000"
    networks:
      - study_network
    depends_on:
      - api

volumes:
  db_data:
  redis_data:

networks:
  study_network:
    name: study_network
    driver: bridge
